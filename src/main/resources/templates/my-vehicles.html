<!DOCTYPE html>
<html lang="en">
  <head>
    <th:block
      th:insert="~{fragments/head :: head(title='Moja vozila | SyncRide')}"
    ></th:block>
  </head>
  <body class="m-0 h-screen flex flex-col">
    <th:block th:insert="~{fragments/header :: header}"></th:block>
    <main class="h-full">
      <div class="px-52 py-4 mt-16">
        <h1 class="text-3xl font-semibold text-gray-800">Moja vozila</h1>
        <div class="mt-12 flex gap-4">
          <a
            href="/account/vehicles/new"
            class="p-4 h-48 aspect-square bg-gray-50 text-gray-500 text-sm dark:text-neutral-500 flex flex-col justify-center items-center border border-dashed border-gray-200 rounded-xl dark:bg-neutral-800 dark:border-neutral-700"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-car-front size-6"
            >
              <path
                d="m21 8-2 2-1.5-3.7A2 2 0 0 0 15.646 5H8.4a2 2 0 0 0-1.903 1.257L5 10 3 8"
              />
              <path d="M7 14h.01" />
              <path d="M17 14h.01" />
              <rect width="18" height="8" x="3" y="10" rx="2" />
              <path d="M5 18v2" />
              <path d="M19 18v2" />
            </svg>
            <span>Novo vozilo</span>
          </a>
          <div
            th:each="car : ${cars}"
            class="p-4 h-48 aspect-square bg-gray-50 text-gray-500 text-sm dark:text-neutral-500 flex flex-col justify-center items-center border border-gray-200 rounded-xl dark:bg-neutral-800 dark:border-neutral-700"
          >
            <p th:text="${car.make + ' ' + car.model}"></p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
