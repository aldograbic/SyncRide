<!DOCTYPE html>
<html lang="en">
  <head>
    <th:block
      th:insert="~{fragments/head :: head(title='Dodaj vozilo | SyncRide')}"
    ></th:block>
  </head>
  <body class="m-0 h-screen flex flex-col">
    <th:block th:insert="~{fragments/header :: header}"></th:block>
    <main>
      <div class="px-52 py-4 mt-16">
        <h1 class="text-3xl font-semibold text-gray-800">Dodaj vozilo</h1>
        <form action="/account/vehicles/new" method="post">
          <div class="w-full">
            <label
              for="make"
              class="block text-sm font-medium mb-2 dark:text-white"
              >Proizvođač vozila</label
            >
            <input
              type="text"
              id="make"
              name="make"
              class="py-3 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-emerald-400 focus:ring-emerald-400 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
              placeholder="Proizvođač vozila"
              required
            />
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
