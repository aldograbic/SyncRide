<!DOCTYPE html>
<html lang="en">
  <head>
    <th:block
      th:insert="~{fragments/head :: head(title='Osobni podaci | SyncRide')}"
    ></th:block>
  </head>
  <body>
    <th:block th:insert="~{fragments/header :: header}"></th:block>
    <main>
      <div class="px-52 py-4 mt-16">
        <!-- BREADCRUMBS-->
        <ol class="flex items-center whitespace-nowrap text-sm">
          <li class="inline-flex items-center">
            <a
              class="flex items-center text-gray-600 hover:text-gray-900 focus:outline-none focus:text-gray-900 dark:text-neutral-500 dark:hover:text-blue-500 dark:focus:text-blue-500"
              href="/account"
            >
              Račun
            </a>
            <svg
              class="shrink-0 mx-2 size-4 text-gray-400 dark:text-neutral-600"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </li>
          <li class="inline-flex items-center">
            <a
              class="flex items-center text-gray-600 hover:text-gray-900 focus:outline-none focus:text-gray-900 dark:text-neutral-500 dark:hover:text-blue-500 dark:focus:text-blue-500"
              href="/personal-info"
            >
              Osobni podaci
            </a>
          </li>
        </ol>

        <!-- HEADER -->
        <h1 class="mt-4 text-4xl font-bold text-gray-800">Osobni podaci</h1>
        <div class="flex w-full lg:w-2/3 justify-between mt-12">
          <!-- LEFT SIDE: PERSONAL INFO DISPLAY-->
          <div class="w-full">
            <div class="py-4 flex justify-between items-center">
              <div>
                <p class="font-semibold">Ime i prezime</p>
                <p class="text-gray-800" th:text="${user.fullName}"></p>
              </div>
              <a href="" class="underline text-sm">Uredi</a>
            </div>
            <hr />
            <div class="py-4 flex justify-between items-center">
              <div>
                <p class="font-semibold">E-mail adresa</p>
                <p class="text-gray-800" th:text="${maskedEmail}"></p>
              </div>
              <a href="" class="underline text-sm">Uredi</a>
            </div>

            <hr />
            <div class="py-4 flex justify-between items-center">
              <div>
                <p class="font-semibold">Broj telefona</p>
                <p class="text-gray-800" th:text="${user.phone}"></p>
              </div>
              <a href="" class="underline text-sm">Uredi</a>
            </div>
            <hr />

            <div class="py-4 flex justify-between items-center">
              <div>
                <p class="font-semibold">Adresa</p>
                <p class="text-gray-800" th:text="${user.address}"></p>
              </div>
              <a href="" class="underline text-sm">Uredi</a>
            </div>
            <hr />
            <div class="py-4 flex justify-between items-center">
              <div>
                <p class="font-semibold">Grad/općina</p>
                <!-- <p class="text-gray-800" th:text="${user.city.cityName}"></p> -->
              </div>
              <a href="" class="underline text-sm">Uredi</a>
            </div>
            <hr />
            <div class="py-4 flex justify-between items-center">
              <div>
                <p class="font-semibold">Poštanski broj</p>
                <p class="text-gray-800" th:text="${user.postCode}"></p>
              </div>
              <a href="" class="underline text-sm">Uredi</a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
