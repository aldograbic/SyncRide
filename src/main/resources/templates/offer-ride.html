<!DOCTYPE html>
<html lang="en">
  <head>
    <th:block
      th:insert="~{fragments/head :: head(title='Objavi vožnju | SyncRide')}"
    ></th:block>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/hr.js"></script>
    <script
      src="https://maps.googleapis.com/maps/api/js?key=REDACTED-GOOGLE-MAPS-KEY&libraries=places&loading=async&callback=initMap"
      async
      defer
    ></script>
  </head>
  <body
    class="m-0 h-screen flex flex-col"
    x-data="{ showStepper: false, activeStep: 1 }"
  >
    <th:block th:insert="~{fragments/header :: header}"></th:block>

    <!-- Main Content -->
    <div
      class="flex items-center justify-center flex-grow dark:bg-neutral-900"
      x-show="!showStepper"
    >
      <div class="mx-4 md:mx-0 flex flex-col space-y-2 mb-16">
        <h1 class="text-3xl md:text-4xl font-extrabold">
          Objavite svoju vožnju
        </h1>
        <h2
          class="pb-4 text-gray-600 dark:text-neutral-300 text-center text-sm"
        >
          Povežite se s putnicima koji traže vožnju
        </h2>
        <button
          type="button"
          class="py-2 px-3 inline-flex justify-center items-center gap-x-2 font-medium rounded-lg border border-transparent bg-emerald-400 text-white hover:bg-emerald-500 focus:outline-none focus:bg-emerald-500 disabled:opacity-50 disabled:pointer-events-none"
          @click="setTimeout(() => { showStepper = true; }, 200)"
        >
          Započni
        </button>
      </div>
    </div>

    <!-- Stepper -->
    <div
      data-hs-stepper=""
      x-show="showStepper"
      style="display: none"
      x-transition
      class="px-4 md:px-52 py-4 md:mt-16 dark:bg-neutral-900 h-full"
    >
      <!-- Stepper Nav -->
      <ul class="relative flex flex-row">
        <li data-hs-stepper-nav-item='{"index": 1}'>
          <h1
            class="text-3xl font-semibold justify-center items-center text-left"
            x-show="activeStep === 1"
          >
            Odaberite automobil
          </h1>
        </li>

        <li data-hs-stepper-nav-item='{"index": 2}'>
          <h1
            class="text-3xl font-semibold justify-center items-center text-left"
            x-show="activeStep === 2"
          >
            Informacije o vožnji
          </h1>
        </li>

        <li data-hs-stepper-nav-item='{"index": 3}'>
          <h1
            class="text-3xl font-semibold justify-center items-center text-left"
            x-show="activeStep === 3"
          >
            Provjerite i potvrdite
          </h1>
        </li>
      </ul>
      <!-- End Stepper Nav -->

      <!-- Stepper Content -->
      <form
        action="/offer"
        method="POST"
        class="mt-5 sm:mt-8"
        x-data="{ startLoc: '',
        endLoc: '',
        depTime: '',
        step2Entered: false,
        get isAnyInputEmpty() {
          return this.step2Entered && (!this.startLoc || !this.endLoc || !this.depTime);
        },
        selected: false, 
        price: 0, 
        minPrice: 0, 
        maxPrice: 1000, 
        seats: 1, 
        minSeats: 0, 
        maxSeats: 10 }"
      >
        <div
          data-hs-stepper-content-item='{"index": 1}'
          x-show="activeStep === 1"
        >
          <div class="flex gap-4">
            <a
              href="/account/vehicles/new?redirectUrl=/offer"
              class="p-4 h-48 aspect-square bg-gray-50 text-gray-500 text-sm dark:text-neutral-500 flex flex-col justify-center items-center border border-dashed border-gray-200 rounded-xl dark:bg-neutral-800 dark:border-neutral-700"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-car-front size-6"
              >
                <path
                  d="m21 8-2 2-1.5-3.7A2 2 0 0 0 15.646 5H8.4a2 2 0 0 0-1.903 1.257L5 10 3 8"
                />
                <path d="M7 14h.01" />
                <path d="M17 14h.01" />
                <rect width="18" height="8" x="3" y="10" rx="2" />
                <path d="M5 18v2" />
                <path d="M19 18v2" />
              </svg>
              <span>Novo vozilo</span>
            </a>
            <div
              th:each="car : ${cars}"
              x-on:click="selected = !selected"
              :class="selected ? 'bg-emerald-400 text-white border-emerald-400' : 'bg-gray-50 text-gray-500 border-gray-200'"
              class="p-4 h-48 aspect-square cursor-pointer text-sm dark:text-neutral-500 flex flex-col justify-center items-center border rounded-xl dark:bg-neutral-800 dark:border-neutral-700 transition-all duration-300"
            >
              <p th:text="${car.make + ' ' + car.model}"></p>
              <input type="hidden" name="carId" th:value="${car.carId}" />
            </div>
          </div>
        </div>

        <div
          data-hs-stepper-content-item='{"index": 2}'
          x-show="activeStep === 2"
        >
          <div class="space-y-4">
            <div class="flex gap-2 w-full">
              <div class="w-full">
                <label
                  for="startLocation"
                  class="block text-sm font-medium mb-2 dark:text-white"
                  >Početna lokacija</label
                >
                <div class="relative">
                  <input
                    type="text"
                    id="startLocation"
                    name="startLocation"
                    x-model="startLoc"
                    class="py-3 px-4 ps-11 block w-full border-gray-200 rounded-lg text-sm focus:border-emerald-400 focus:ring-emerald-400 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
                    placeholder="Putujem od"
                    required
                  />
                  <div
                    class="absolute inset-y-0 start-0 flex items-center pointer-events-none z-20 ps-4"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-map-pin shrink-0 size-5 text-gray-400 dark:text-neutral-600"
                    >
                      <path
                        d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"
                      />
                      <circle cx="12" cy="10" r="3" />
                    </svg>
                  </div>
                </div>
              </div>
              <div class="w-full">
                <label
                  for="endLocation"
                  class="block text-sm font-medium mb-2 dark:text-white"
                  >Završna lokacija</label
                >
                <div class="relative">
                  <input
                    type="text"
                    id="endLocation"
                    name="endLocation"
                    x-model="endLoc"
                    class="py-3 px-4 ps-11 block w-full border-gray-200 rounded-lg text-sm focus:border-emerald-400 focus:ring-emerald-400 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
                    placeholder="Putujem do"
                    required
                  />
                  <div
                    class="absolute inset-y-0 start-0 flex items-center pointer-events-none z-20 ps-4"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-map-pin shrink-0 size-5 text-gray-400 dark:text-neutral-600"
                    >
                      <path
                        d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"
                      />
                      <circle cx="12" cy="10" r="3" />
                    </svg>
                  </div>
                </div>
              </div>

              <input type="hidden" id="startLat" name="startLat" />
              <input type="hidden" id="startLng" name="startLng" />
              <input type="hidden" id="endLat" name="endLat" />
              <input type="hidden" id="endLng" name="endLng" />
            </div>
            <div
              id="map"
              style="height: 400px; width: 100%"
              class="mt-4 rounded-lg"
            ></div>
            <div class="w-full">
              <label
                for="departureTime"
                class="block text-sm font-medium mb-2 dark:text-white"
                >Datum i vrijeme polaska</label
              >
              <div class="relative">
                <input
                  type="text"
                  id="departureTime"
                  name="departureTime"
                  x-model="depTime"
                  class="py-3 px-4 ps-11 block w-full border-gray-200 rounded-lg text-sm focus:border-emerald-400 focus:ring-emerald-400 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
                  placeholder="Odaberite datum i vrijeme polaska"
                  required
                />
                <div
                  class="absolute inset-y-0 start-0 flex items-center pointer-events-none z-20 ps-4"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-calendar shrink-0 size-5 text-gray-400 dark:text-neutral-600"
                  >
                    <path d="M8 2v4" />
                    <path d="M16 2v4" />
                    <rect width="18" height="18" x="3" y="4" rx="2" />
                    <path d="M3 10h18" />
                  </svg>
                </div>
              </div>
            </div>

            <script>
              flatpickr("#departureTime", {
                enableTime: true,
                dateFormat: "Y-m-d H:i",
                altFormat: "d.m.Y, H:i",
                altInput: true,
                minDate: "today",
                locale: "hr",
              });
            </script>
            <div class="w-full">
              <label
                for="availableSeats"
                class="block text-sm font-medium mb-2 dark:text-white"
                >Broj raspoloživih mjesta</label
              >
              <div
                :class="{'border-red-500': seats < minSeats || seats > maxSeats}"
                class="py-3 px-4 bg-white border border-gray-200 rounded-lg dark:bg-neutral-900 dark:border-neutral-700"
                data-hs-input-number='{
                            "step": 1,
                            "min": 1,
                            "max": 10
                          }'
              >
                <div class="w-full flex justify-between items-center gap-x-5">
                  <div class="grow relative">
                    <input
                      id="availableSeats"
                      name="availableSeats"
                      style="-moz-appearance: textfield"
                      type="number"
                      aria-roledescription="Number field"
                      value="1"
                      x-model="seats"
                      data-hs-input-number-input=""
                      class="p-0 ps-7 block w-full bg-transparent focus:ring-0 [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none border-0 border-gray-200 rounded-lg text-sm focus:border-emerald-400 focus:ring-emerald-400 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
                      placeholder="Odaberite broj slobodnih mjesta"
                      required
                    />
                    <div
                      class="absolute inset-y-0 start-0 flex items-center pointer-events-none z-20"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-armchair shrink-0 size-5 text-gray-400 dark:text-neutral-600"
                      >
                        <path d="M19 9V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v3" />
                        <path
                          d="M3 16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v1.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V11a2 2 0 0 0-4 0z"
                        />
                        <path d="M5 18v2" />
                        <path d="M19 18v2" />
                      </svg>
                    </div>
                  </div>
                  <div class="flex justify-end items-center gap-x-1.5">
                    <button
                      type="button"
                      class="size-6 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-full border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-800 dark:focus:bg-neutral-800"
                      tabindex="-1"
                      aria-label="Decrease"
                      data-hs-input-number-decrement=""
                    >
                      <svg
                        class="shrink-0 size-3.5"
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M5 12h14"></path>
                      </svg>
                    </button>
                    <button
                      type="button"
                      class="size-6 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-full border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-800 dark:focus:bg-neutral-800"
                      tabindex="-1"
                      aria-label="Increase"
                      data-hs-input-number-increment=""
                    >
                      <svg
                        class="shrink-0 size-3.5"
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M5 12h14"></path>
                        <path d="M12 5v14"></path>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
              <p
                x-show="seats < minSeats || seats > maxSeats"
                class="text-sm text-red-600 mt-2"
                id="hs-validation-name-error-helper"
              >
                Broj slobodnih mjesta je izvan raspona.
              </p>
            </div>
            <div class="w-full">
              <label
                for="pricePerPerson"
                class="block text-sm font-medium mb-2 dark:text-white"
                >Cijena po osobi</label
              >
              <div
                :class="{'border-red-500': price < minPrice || price > maxPrice}"
                class="py-3 px-4 bg-white border border-gray-200 rounded-lg dark:bg-neutral-900 dark:border-neutral-700"
                data-hs-input-number='{
                  "step": 1,
                  "min": 0,
                  "max": 1000
                }'
              >
                <div class="w-full flex justify-between items-center gap-x-5">
                  <div class="grow relative">
                    <input
                      id="pricePerPerson"
                      name="pricePerPerson"
                      style="-moz-appearance: textfield"
                      type="number"
                      aria-roledescription="Number field"
                      value="0"
                      x-model="price"
                      data-hs-input-number-input=""
                      class="p-0 ps-7 block w-full bg-transparent focus:ring-0 [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none border-0 border-gray-200 rounded-lg text-sm focus:border-emerald-400 focus:ring-emerald-400 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
                      placeholder="Odaberite datum i vrijeme polaska"
                      required
                    />
                    <div
                      class="absolute inset-y-0 start-0 flex items-center pointer-events-none z-20"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-euro shrink-0 size-5 text-gray-400 dark:text-neutral-600"
                      >
                        <path d="M4 10h12" />
                        <path d="M4 14h9" />
                        <path
                          d="M19 6a7.7 7.7 0 0 0-5.2-2A7.9 7.9 0 0 0 6 12c0 4.4 3.5 8 7.8 8 2 0 3.8-.8 5.2-2"
                        />
                      </svg>
                    </div>
                  </div>

                  <div class="flex justify-end items-center gap-x-1.5">
                    <button
                      type="button"
                      class="size-6 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-full border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-800 dark:focus:bg-neutral-800"
                      tabindex="-1"
                      aria-label="Decrease"
                      data-hs-input-number-decrement=""
                    >
                      <svg
                        class="shrink-0 size-3.5"
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M5 12h14"></path>
                      </svg>
                    </button>
                    <button
                      type="button"
                      class="size-6 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-full border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-800 dark:focus:bg-neutral-800"
                      tabindex="-1"
                      aria-label="Increase"
                      data-hs-input-number-increment=""
                    >
                      <svg
                        class="shrink-0 size-3.5"
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M5 12h14"></path>
                        <path d="M12 5v14"></path>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
              <p
                x-show="price < minPrice || price > maxPrice"
                class="text-sm text-red-600 mt-2"
                id="hs-validation-name-error-helper"
              >
                Cijena je izvan raspona.
              </p>
            </div>

            <div class="w-full">
              <label
                for="additionalInfo"
                class="block text-sm font-medium mb-2 dark:text-white"
                >Dodatne Informacije (opcionalno)</label
              >
              <textarea
                id="additionalInfo"
                name="additionalInfo"
                class="py-3 px-4 block w-full resize-none border-gray-200 rounded-lg text-sm focus:border-emerald-400 focus:ring-emerald-400 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
                rows="3"
                placeholder="..."
              ></textarea>
            </div>
          </div>
        </div>

        <div
          data-hs-stepper-content-item='{"index": 3}'
          x-show="activeStep === 3"
        >
          <div
            class="p-4 bg-gray-50 flex justify-center items-center border border-dashed border-gray-200 rounded-xl dark:bg-neutral-800 dark:border-neutral-700"
          >
            <p>Putujem od: <span x-text="startLoc"></span></p>
            <p>Putujem do: <span x-text="endLoc"></span></p>
            <p>Krećem u: <span x-text="depTime"></span></p>
          </div>
        </div>

        <!-- Button Group -->
        <div class="mt-5 flex justify-between items-center gap-x-2">
          <button
            type="button"
            class="py-2 px-3 inline-flex items-center gap-x-1 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-300 dark:hover:bg-neutral-700 dark:focus:bg-neutral-700"
            :disabled="activeStep === 1"
            @click="activeStep = Math.max(1, activeStep - 1)"
          >
            <svg
              class="shrink-0 size-4"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m15 18-6-6 6-6"></path>
            </svg>
            Natrag
          </button>

          <button
            type="button"
            class="py-2 px-3 inline-flex items-center gap-x-1 text-sm font-medium rounded-lg border border-transparent bg-emerald-400 text-white hover:bg-emerald-500 focus:outline-none focus:bg-emerald-500 disabled:opacity-50 disabled:pointer-events-none"
            x-show="activeStep < 3"
            @click="activeStep = Math.min(3, activeStep + 1), step2Entered = true"
            :disabled="(isAnyInputEmpty || price < minPrice || price > maxPrice) || (seats < minSeats || seats > maxSeats) || !selected"
          >
            Dalje
            <svg
              class="shrink-0 size-4"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>

          <button
            type="submit"
            class="py-2 px-3 inline-flex items-center gap-x-1 text-sm font-medium rounded-lg border border-transparent bg-emerald-400 text-white hover:bg-emerald-500 focus:outline-none focus:bg-emerald-500 disabled:opacity-50 disabled:pointer-events-none"
            x-show="activeStep === 3"
          >
            Objavi
          </button>
        </div>
      </form>
    </div>
    <script>
      let map, startMarker, endMarker, directionsService, directionsRenderer;

      function initMap() {
        // Default location: Zagreb
        const defaultLocation = { lat: 45.815399, lng: 15.966568 };

        // Try to get user's current location
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            function (position) {
              const userLocation = {
                lat: position.coords.latitude,
                lng: position.coords.longitude,
              };
              initializeMap(userLocation); // Initialize with user's location
            },
            function () {
              // If the user denies location access or error occurs
              initializeMap(defaultLocation); // Initialize with default location
            }
          );
        } else {
          // If browser doesn't support Geolocation
          initializeMap(defaultLocation);
        }
      }

      function initializeMap(initialLocation) {
        // Initialize the map with the specified location (either user's or default)
        map = new google.maps.Map(document.getElementById("map"), {
          center: initialLocation,
          zoom: 11,
        });

        directionsService = new google.maps.DirectionsService();
        directionsRenderer = new google.maps.DirectionsRenderer({ map: map });

        // Initialize places autocomplete for start and end locations
        const startInput = document.getElementById("startLocation");
        const endInput = document.getElementById("endLocation");

        const startAutocomplete = new google.maps.places.Autocomplete(
          startInput
        );
        const endAutocomplete = new google.maps.places.Autocomplete(endInput);

        // Start Location Selection
        startAutocomplete.addListener("place_changed", () => {
          const place = startAutocomplete.getPlace();
          if (place.geometry) {
            map.setCenter(place.geometry.location);
            if (!startMarker) {
              startMarker = new google.maps.Marker({
                position: place.geometry.location,
                map: map,
              });
            } else {
              startMarker.setPosition(place.geometry.location);
            }

            // Save coordinates to hidden inputs
            document.getElementById("startLat").value =
              place.geometry.location.lat();
            document.getElementById("startLng").value =
              place.geometry.location.lng();
            calculateRoute();
          }
        });

        // End Location Selection
        endAutocomplete.addListener("place_changed", () => {
          const place = endAutocomplete.getPlace();
          if (place.geometry) {
            if (!endMarker) {
              endMarker = new google.maps.Marker({
                position: place.geometry.location,
                map: map,
              });
            } else {
              endMarker.setPosition(place.geometry.location);
            }

            // Save coordinates to hidden inputs
            document.getElementById("endLat").value =
              place.geometry.location.lat();
            document.getElementById("endLng").value =
              place.geometry.location.lng();
            calculateRoute();
          }
        });
      }

      function calculateRoute() {
        const startLat = document.getElementById("startLat").value;
        const startLng = document.getElementById("startLng").value;
        const endLat = document.getElementById("endLat").value;
        const endLng = document.getElementById("endLng").value;

        if (startLat && startLng && endLat && endLng) {
          const start = new google.maps.LatLng(startLat, startLng);
          const end = new google.maps.LatLng(endLat, endLng);

          const request = {
            origin: start,
            destination: end,
            travelMode: google.maps.TravelMode.DRIVING,
          };

          directionsService.route(request, (result, status) => {
            if (status === "OK") {
              directionsRenderer.setDirections(result);
            }
          });
        }
      }

      // Load the map
      window.initMap = initMap;
    </script>
  </body>
</html>
