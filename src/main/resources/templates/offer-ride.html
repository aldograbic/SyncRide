<!DOCTYPE html>
<html lang="en">
  <head>
    <th:block
      th:insert="~{fragments/head :: head(title='Objavi vožnju | SyncRide')}"
    ></th:block>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/hr.js"></script>
  </head>
  <body
    class="m-0 h-screen flex flex-col"
    x-data="{ showStepper: false, activeStep: 1 }"
  >
    <th:block th:insert="~{fragments/header :: header}"></th:block>

    <!-- Main Content -->
    <div
      class="flex items-center justify-center flex-grow dark:bg-neutral-900"
      x-show="!showStepper"
    >
      <div class="flex flex-col space-y-2 mb-16">
        <h1 class="text-4xl font-extrabold">Objavite svoju vožnju</h1>
        <h2
          class="pb-4 text-gray-600 dark:text-neutral-300 text-center text-sm"
        >
          Povežite se s putnicima koji traže vožnju
        </h2>
        <button
          type="button"
          class="py-2 px-3 inline-flex justify-center items-center gap-x-2 font-medium rounded-lg border border-transparent bg-emerald-400 text-white hover:bg-emerald-500 focus:outline-none focus:bg-emerald-500 disabled:opacity-50 disabled:pointer-events-none"
          @click="setTimeout(() => { showStepper = true; }, 200)"
        >
          Započni
        </button>
      </div>
    </div>

    <!-- Stepper -->
    <div
      data-hs-stepper=""
      x-show="showStepper"
      style="display: none"
      x-transition
      class="px-52 py-4 mt-16 dark:bg-neutral-900 h-full"
    >
      <!-- Stepper Nav -->
      <ul class="relative flex flex-row gap-x-2">
        <li data-hs-stepper-nav-item='{"index": 1}'>
          <h1
            class="text-3xl font-semibold justify-center items-center text-left"
            x-show="activeStep === 1"
          >
            Odaberite automobil
          </h1>
        </li>

        <li data-hs-stepper-nav-item='{"index": 2}'>
          <h1
            class="text-3xl font-semibold justify-center items-center text-left"
            x-show="activeStep === 2"
          >
            Informacije o vožnji
          </h1>
        </li>

        <li data-hs-stepper-nav-item='{"index": 3}'>
          <h1
            class="text-3xl font-semibold justify-center items-center text-left"
            x-show="activeStep === 3"
          >
            Provjerite i potvrdite
          </h1>
        </li>
      </ul>
      <!-- End Stepper Nav -->

      <!-- Stepper Content -->
      <form action="/offer" method="POST" class="mt-5 sm:mt-8">
        <div
          data-hs-stepper-content-item='{"index": 1}'
          x-show="activeStep === 1"
        >
          <div class="flex gap-4">
            <a
              href="/account/vehicles/new"
              class="p-4 h-48 aspect-square bg-gray-50 text-gray-500 text-sm dark:text-neutral-500 flex flex-col justify-center items-center border border-dashed border-gray-200 rounded-xl dark:bg-neutral-800 dark:border-neutral-700"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-car-front size-6"
              >
                <path
                  d="m21 8-2 2-1.5-3.7A2 2 0 0 0 15.646 5H8.4a2 2 0 0 0-1.903 1.257L5 10 3 8"
                />
                <path d="M7 14h.01" />
                <path d="M17 14h.01" />
                <rect width="18" height="8" x="3" y="10" rx="2" />
                <path d="M5 18v2" />
                <path d="M19 18v2" />
              </svg>
              <span>Novo vozilo</span>
            </a>
            <div
              th:each="car : ${cars}"
              x-data="{ selected: false }"
              x-on:click="selected = !selected"
              :class="selected ? 'bg-emerald-400 text-white border-emerald-400' : 'bg-gray-50 text-gray-500 border-gray-200'"
              class="p-4 h-48 aspect-square cursor-pointer text-sm dark:text-neutral-500 flex flex-col justify-center items-center border rounded-xl dark:bg-neutral-800 dark:border-neutral-700 transition-all duration-300"
            >
              <p th:text="${car.make + ' ' + car.model}"></p>
              <input type="hidden" name="carId" th:value="${car.carId}" />
            </div>
          </div>
        </div>

        <div
          data-hs-stepper-content-item='{"index": 2}'
          x-show="activeStep === 2"
        >
          <div class="space-y-4">
            <div class="flex gap-2 w-full">
              <div class="w-full">
                <label
                  for="startLocation"
                  class="block text-sm font-medium mb-2 dark:text-white"
                  >Početna lokacija</label
                >
                <input
                  type="text"
                  id="startLocation"
                  name="startLocation"
                  class="py-3 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-emerald-400 focus:ring-emerald-400 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
                  placeholder="Putujem od"
                  required
                />
              </div>
              <div class="w-full">
                <label
                  for="endLocation"
                  class="block text-sm font-medium mb-2 dark:text-white"
                  >Završna lokacija</label
                >
                <input
                  type="text"
                  id="endLocation"
                  name="endLocation"
                  class="py-3 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-emerald-400 focus:ring-emerald-400 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
                  placeholder="Putujem do"
                  required
                />
              </div>
            </div>
            <div class="w-full">
              <label
                for="departureTime"
                class="block text-sm font-medium mb-2 dark:text-white"
                >Datum i vrijeme polaska</label
              >
              <input
                type="text"
                id="departureTime"
                name="departureTime"
                class="py-3 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-emerald-400 focus:ring-emerald-400 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
                placeholder="Odaberite datum i vrijeme polaska"
              />
            </div>

            <script>
              flatpickr("#departureTime", {
                enableTime: true,
                dateFormat: "Y-m-d H:i",
                altFormat: "d.m.Y, H:i",
                altInput: true,
                minDate: "today",
                locale: "hr",
              });
            </script>
            <div class="w-full">
              <label
                for="seatCount"
                class="block text-sm font-medium mb-2 dark:text-white"
                >Broj raspoloživih mjesta</label
              >
              <div
                class="py-3 px-4 bg-white border border-gray-200 rounded-lg dark:bg-neutral-900 dark:border-neutral-700"
                data-hs-input-number='{
                            "step": 1,
                            "min": 1,
                            "max": 10
                          }'
              >
                <div class="w-full flex justify-between items-center gap-x-5">
                  <div class="grow">
                    <input
                      id="seatCount"
                      name="seatCount"
                      class="w-full p-0 bg-transparent border-0 text-gray-800 focus:ring-0 [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none dark:text-white"
                      style="-moz-appearance: textfield"
                      type="number"
                      aria-roledescription="Number field"
                      value="1"
                      data-hs-input-number-input=""
                      required
                    />
                  </div>
                  <div class="flex justify-end items-center gap-x-1.5">
                    <button
                      type="button"
                      class="size-6 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-full border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-800 dark:focus:bg-neutral-800"
                      tabindex="-1"
                      aria-label="Decrease"
                      data-hs-input-number-decrement=""
                    >
                      <svg
                        class="shrink-0 size-3.5"
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M5 12h14"></path>
                      </svg>
                    </button>
                    <button
                      type="button"
                      class="size-6 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-full border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-800 dark:focus:bg-neutral-800"
                      tabindex="-1"
                      aria-label="Increase"
                      data-hs-input-number-increment=""
                    >
                      <svg
                        class="shrink-0 size-3.5"
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M5 12h14"></path>
                        <path d="M12 5v14"></path>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <div class="w-full">
              <label
                for="pricePerPerson"
                class="block text-sm font-medium mb-2 dark:text-white"
                >Cijena po osobi</label
              >
              <div
                class="py-3 px-4 bg-white border border-gray-200 rounded-lg dark:bg-neutral-900 dark:border-neutral-700"
                data-hs-input-number='{
                  "step": 1,
                  "min": 0,
                  "max": 1000
                }'
              >
                <div class="w-full flex justify-between items-center gap-x-5">
                  <div class="flex items-center grow">
                    <input
                      id="pricePerPerson"
                      name="pricePerPerson"
                      class="w-full p-0 bg-transparent border-0 text-gray-800 focus:ring-0 [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none dark:text-white"
                      style="-moz-appearance: textfield"
                      type="number"
                      aria-roledescription="Number field"
                      value="0"
                      data-hs-input-number-input=""
                      required
                    />
                    <span class="text-gray-800 ml-2">€</span>
                    <!-- Euro symbol added here -->
                  </div>
                  <div class="flex justify-end items-center gap-x-1.5">
                    <button
                      type="button"
                      class="size-6 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-full border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-800 dark:focus:bg-neutral-800"
                      tabindex="-1"
                      aria-label="Decrease"
                      data-hs-input-number-decrement=""
                    >
                      <svg
                        class="shrink-0 size-3.5"
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M5 12h14"></path>
                      </svg>
                    </button>
                    <button
                      type="button"
                      class="size-6 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-full border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-800 dark:focus:bg-neutral-800"
                      tabindex="-1"
                      aria-label="Increase"
                      data-hs-input-number-increment=""
                    >
                      <svg
                        class="shrink-0 size-3.5"
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M5 12h14"></path>
                        <path d="M12 5v14"></path>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div class="w-full">
              <label
                for="additionalInfo"
                class="block text-sm font-medium mb-2 dark:text-white"
                >Dodatne Informacije (opcionalno)</label
              >
              <textarea
                id="additionalInfo"
                name="additionalInfo"
                class="py-3 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-emerald-400 focus:ring-emerald-400 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
                rows="3"
                placeholder="..."
              ></textarea>
            </div>
          </div>
        </div>

        <div
          data-hs-stepper-content-item='{"index": 3}'
          x-show="activeStep === 3"
        >
          <div
            class="p-4 h-48 bg-gray-50 flex justify-center items-center border border-dashed border-gray-200 rounded-xl dark:bg-neutral-800 dark:border-neutral-700"
          >
            <h3 class="text-gray-500 dark:text-neutral-500">Third content</h3>
          </div>
        </div>

        <!-- Button Group -->
        <div class="mt-5 flex justify-between items-center gap-x-2">
          <button
            type="button"
            class="py-2 px-3 inline-flex items-center gap-x-1 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-300 dark:hover:bg-neutral-700 dark:focus:bg-neutral-700"
            :disabled="activeStep === 1"
            @click="activeStep = Math.max(1, activeStep - 1)"
          >
            <svg
              class="shrink-0 size-4"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m15 18-6-6 6-6"></path>
            </svg>
            Natrag
          </button>

          <button
            type="button"
            class="py-2 px-3 inline-flex items-center gap-x-1 text-sm font-medium rounded-lg border border-transparent bg-emerald-400 text-white hover:bg-emerald-500 focus:outline-none focus:bg-emerald-500 disabled:opacity-50 disabled:pointer-events-none"
            x-show="activeStep < 3"
            @click="activeStep = Math.min(3, activeStep + 1)"
          >
            Dalje
            <svg
              class="shrink-0 size-4"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>

          <button
            type="button"
            class="py-2 px-3 inline-flex items-center gap-x-1 text-sm font-medium rounded-lg border border-transparent bg-emerald-400 text-white hover:bg-emerald-500 focus:outline-none focus:bg-emerald-500 disabled:opacity-50 disabled:pointer-events-none"
            x-show="activeStep === 3"
          >
            Objavi
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
