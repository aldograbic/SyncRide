<!DOCTYPE html>
<html lang="en">
  <head>
    <th:block
      th:insert="~{fragments/head :: head(title='Moj profil | SyncRide')}"
    >
    </th:block>
  </head>

  <body>
    <th:block th:insert="~{fragments/header :: header}"></th:block>

    <main>
      <!-- Card Section -->
      <div class="px-4 md:px-52 py-4 mt-16">
        <!-- BREADCRUMBS-->
        <ol class="flex items-center whitespace-nowrap text-sm">
          <li class="inline-flex items-center">
            <a
              class="flex items-center text-gray-600 hover:text-gray-900 focus:outline-none focus:text-gray-900 dark:text-neutral-500 dark:hover:text-blue-500 dark:focus:text-blue-500"
              href="/account"
            >
              Račun
            </a>
            <svg
              class="shrink-0 mx-2 size-4 text-gray-400 dark:text-neutral-600"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </li>
          <li class="inline-flex items-center">
            <a
              class="flex items-center text-gray-600 hover:text-gray-900 focus:outline-none focus:text-gray-900 dark:text-neutral-500 dark:hover:text-blue-500 dark:focus:text-blue-500"
              href="/account/profile"
            >
              Profil
            </a>
          </li>
        </ol>
        <!-- HEADER -->
        <h1 class="mt-4 text-4xl font-bold text-gray-800">Profil</h1>

        <!-- Card -->
        <div
          class="mt-12 bg-white rounded-xl shadow p-4 sm:p-7 dark:bg-neutral-800"
        >
          <form>
            <!-- Grid -->
            <div class="grid sm:grid-cols-12 gap-2 sm:gap-6">
              <div class="sm:col-span-3">
                <label
                  class="inline-block text-sm text-gray-800 mt-2.5 dark:text-neutral-200"
                >
                  Profilna slika
                </label>
              </div>
              <!-- End Col -->

              <div class="sm:col-span-9">
                <div class="flex items-center gap-5">
                  <div sec:authorize="isAuthenticated()">
                    <img
                      th:if="${user.profilePicture}"
                      th:src="${user.profilePicture}"
                      class="w-16 h-auto rounded-full"
                      alt="User profile picture"
                    />
                    <div
                      th:unless="${user.profilePicture}"
                      th:text="${#strings.substring(user.fullName,0,1)}"
                      class="shrink-0 size-16 rounded-full grid place-items-center text-3xl text-gray-800 dark:text-neutral-200 bg-gray-100 dark:bg-neutral-700"
                    ></div>
                  </div>
                  <div class="flex gap-x-2">
                    <div>
                      <button
                        type="button"
                        class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none focus:outline-none focus:bg-gray-50 dark:bg-transparent dark:border-neutral-700 dark:text-neutral-300 dark:hover:bg-neutral-800 dark:focus:bg-neutral-800"
                      >
                        <svg
                          class="shrink-0 size-4"
                          xmlns="http://www.w3.org/2000/svg"
                          width="24"
                          height="24"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        >
                          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                          <polyline points="17 8 12 3 7 8" />
                          <line x1="12" x2="12" y1="3" y2="15" />
                        </svg>
                        Prenesite sliku
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              <!-- End Col -->

              <!-- End Col -->

              <div class="sm:col-span-3">
                <label
                  for="af-account-bio"
                  class="inline-block text-sm text-gray-800 mt-2.5 dark:text-neutral-200"
                >
                  Kratki opis
                </label>
              </div>
              <!-- End Col -->

              <div class="sm:col-span-9">
                <textarea
                  id="af-account-bio"
                  class="resize-none py-2 px-3 block w-full border-gray-200 rounded-lg text-sm focus:border-emerald-500 focus:ring-emerald-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
                  rows="6"
                  placeholder="Upišite opis profila..."
                ></textarea>
              </div>
              <!-- End Col -->
            </div>
            <!-- End Grid -->

            <div class="mt-5 flex justify-end gap-x-2">
              <button
                type="reset"
                class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none focus:outline-none focus:bg-gray-50 dark:bg-transparent dark:border-neutral-700 dark:text-neutral-300 dark:hover:bg-neutral-800 dark:focus:bg-neutral-800"
              >
                Reset
              </button>
              <button
                type="submit"
                class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-transparent bg-emerald-400 text-white hover:bg-emerald-500 focus:outline-none focus:bg-emerald-500 disabled:opacity-50 disabled:pointer-events-none"
              >
                Spremi
              </button>
            </div>
          </form>
        </div>
        <!-- End Card -->
      </div>
      <!-- End Card Section -->
    </main>
  </body>
</html>
