<!DOCTYPE html>
<html lang="en">
  <head>
    <th:block
      th:insert="~{fragments/head :: head(title='SyncRide')}"
    ></th:block>
  </head>
  <body class="min-h-[120vh]">
    <th:block th:insert="~{fragments/header :: header}"></th:block>
    <main>
      <body x-data="{ rides: [], userLocation: null }">
        <div id="map" style="height: 500px"></div>

        <script>
          document.addEventListener("DOMContentLoaded", function () {
            const map = L.map("map").setView([0, 0], 12); // Default view

            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
              maxZoom: 18,
            }).addTo(map);

            if (navigator.geolocation) {
              navigator.geolocation.getCurrentPosition(function (position) {
                const userLatLng = [
                  position.coords.latitude,
                  position.coords.longitude,
                ];
                map.setView(userLatLng, 12);

                L.marker(userLatLng)
                  .addTo(map)
                  .bindPopup("You are here")
                  .openPopup();

                fetch(
                  `/api/rides/nearby?lat=${userLatLng[0]}&lng=${userLatLng[1]}`
                )
                  .then((response) => response.json())
                  .then((data) => {
                    data.forEach((ride) => {
                      const rideLatLng = [
                        ride.startLatitude,
                        ride.startLongitude,
                      ];
                      L.marker(rideLatLng)
                        .addTo(map)
                        .bindPopup(
                          `<b>Ride from: </b>${ride.startLocation}<br><b>To: </b>${ride.endLocation}`
                        );
                    });
                  });
              });
            }
          });
        </script>
      </body>
    </main>
  </body>
</html>
