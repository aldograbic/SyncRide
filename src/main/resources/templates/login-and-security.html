<!DOCTYPE html>
<html lang="en">
  <head>
    <th:block
      th:insert="~{fragments/head :: head(title='Prijava i sigurnost | SyncRide')}"
    ></th:block>
  </head>
  <body>
    <th:block th:insert="~{fragments/header :: header}"></th:block>
    <!-- Zasjenjenje (overlay) -->
    <div
      id="overlay"
      class="fixed inset-0 bg-gray-800 bg-opacity-50 hidden z-10"
    ></div>
    <main>
      <div class="px-4 md:px-52 py-4 md:mt-16">
        <!-- BREADCRUMBS-->
        <ol class="flex items-center whitespace-nowrap text-sm">
          <li class="inline-flex items-center">
            <a
              class="flex items-center text-gray-600 hover:text-gray-900 focus:outline-none focus:text-gray-900 dark:text-neutral-500 dark:hover:text-blue-500 dark:focus:text-blue-500"
              href="/account"
            >
              Račun
            </a>
            <svg
              class="shrink-0 mx-2 size-4 text-gray-400 dark:text-neutral-600"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </li>
          <li class="inline-flex items-center">
            <a
              class="flex items-center text-gray-600 hover:text-gray-900 focus:outline-none focus:text-gray-900 dark:text-neutral-500 dark:hover:text-blue-500 dark:focus:text-blue-500"
              href="/account/personal-info"
            >
              Prijava i sigurnost
            </a>
          </li>
        </ol>

        <!-- HEADER -->
        <h1 class="mt-4 text-4xl font-bold text-gray-800">Prijava</h1>
        <div
          class="flex md:w-2/3 justify-between mt-12 bg-white rounded-xl shadow"
        >
          <!-- LEFT SIDE: PERSONAL INFO DISPLAY-->
          <div class="w-full px-4">
            <div class="py-4 flex justify-between items-center">
              <div>
                <p class="font-semibold">Lozinka</p>
                <p class="text-gray-800">Zadnja izmjenjena prije 8 dana npr</p>
              </div>
              <button class="underline text-sm" onclick="editPassword()">
                Ažuriraj
              </button>
            </div>

            <!-- Forma za azuriranje lozinke -->
            <div
              id="editPasswordForm"
              class="hidden p-4 bg-white rounded-lg shadow-lg z-20 absolute top-20 left-1/4 right-1/4"
            >
              <form
                action="/account/login-and-security"
                method="post"
                class="space-y-4"
              >
                <input type="hidden" name="action" value="updatePassword" />
                <div>
                  <label
                    for="password"
                    class="block text-sm font-medium text-gray-700"
                    >Nova lozinka</label
                  >
                  <input
                    type="password"
                    id="password"
                    name="password"
                    class="mt-1 p-2 border border-gray-300 rounded-md w-full"
                    required
                  />
                </div>

                <div class="flex justify-end space-x-2">
                  <button
                    type="submit"
                    class="bg-blue-500 text-white py-2 px-4 rounded-md"
                  >
                    Spremi
                  </button>
                  <button
                    type="button"
                    class="bg-gray-300 py-2 px-4 rounded-md"
                    onclick="cancelEdit()"
                  >
                    Odustani
                  </button>
                </div>
              </form>
            </div>
            <hr />

            <!-- Deaktivacija računa -->
            <div class="py-4 flex justify-between items-center">
              <div>
                <p class="font-semibold">Deaktivacija računa</p>
              </div>
              <button
                class="underline hover:text-red-700 text-red-500 text-sm"
                onclick="deleteUserAccount()"
              >
                Deaktivacija
              </button>
            </div>

            <!-- Forma za brisanje racuna -->
            <div
              id="deleteUserAccount"
              class="hidden p-4 bg-white rounded-lg shadow-lg z-20 absolute top-20 left-1/4 right-1/4"
            >
              <form
                action="/account/login-and-security"
                method="post"
                class="space-y-4"
              >
                <input type="hidden" name="action" value="deleteUserAccount" />

                <p>Da li ste sigurni da želite deaktivirati svoj račun?</p>
                <div>
                  <label
                    for="password"
                    class="block text-sm font-medium text-gray-700"
                    >Unesite lozinku</label
                  >
                  <input
                    type="password"
                    name="password"
                    id="password"
                    required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm"
                  />
                </div>

                <div class="flex justify-end space-x-2">
                  <button
                    type="submit"
                    class="bg-blue-500 text-white py-2 px-4 rounded-md"
                  >
                    Potvrdi
                  </button>
                  <button
                    type="button"
                    class="bg-gray-300 py-2 px-4 rounded-md"
                    onclick="cancelDelete()"
                  >
                    Odustani
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>

<script>
  function editPassword() {
    document.getElementById("editPasswordForm").classList.remove("hidden");
    document.getElementById("overlay").classList.remove("hidden");
  }

  function deleteUserAccount() {
    document.getElementById("deleteUserAccount").classList.remove("hidden");
    document.getElementById("overlay").classList.remove("hidden");
  }

  function cancelDelete() {
    document.getElementById("deleteUserAccount").classList.add("hidden");
    document.getElementById("overlay").classList.add("hidden");
  }

  function cancelEdit() {
    document.getElementById("editPasswordForm").classList.add("hidden");
    document.getElementById("overlay").classList.add("hidden");
  }
</script>
